
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מטווח המסבאה - המערב הפרוע</title>
    <meta name="description" content="משחק יריות קלאסי במערב הפרוע. שבור בקבוקים, שדרג את הנשק ושבור שיאים!" />
    <meta name="keywords" content="משחק יריות, מערב פרוע, קאובוי, משחק דפדפן, מטווח" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤠</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rye&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #1a1a1a;
        --accent: #d97706;
      }
      .theme-sepia {
        --bg-main: #4a3728;
        filter: sepia(0.3) contrast(1.1);
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Varela Round', sans-serif;
        background-color: var(--bg-main);
        cursor: crosshair;
        user-select: none;
        transition: background-color 0.5s ease;
      }
      .font-rye {
        font-family: 'Rye', cursive;
      }
      @keyframes shockwave {
        0% {
          width: 0px;
          height: 0px;
          opacity: 1;
          border-width: 6px;
          border-color: rgba(255, 255, 255, 0.8);
          transform: translate(-50%, -50%) scale(0.1);
        }
        50% {
          opacity: 0.6;
          border-color: rgba(251, 191, 36, 0.5);
        }
        100% {
          width: 250px;
          height: 250px;
          opacity: 0;
          border-width: 1px;
          transform: translate(-50%, -50%) scale(1.5);
        }
      }
      .animate-shockwave {
        animation: shockwave 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }
      @keyframes smoke-rise {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        20% { opacity: 0.6; }
        100% { transform: translate(-50%, -250%) scale(4); opacity: 0; }
      }
      .animate-smoke {
        animation: smoke-rise 2.5s ease-out forwards;
      }
      @keyframes fire-ember {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: brightness(1.5); }
        100% { transform: translate(-50%, -100%) scale(0); opacity: 0; }
      }
      .animate-ember {
        animation: fire-ember 1.5s ease-out forwards;
      }
      @keyframes screen-shake {
        0% { transform: translate(2px, 2px) rotate(0deg); }
        10% { transform: translate(-2px, -4px) rotate(-1deg); }
        20% { transform: translate(-6px, 0px) rotate(1deg); }
        30% { transform: translate(6px, 4px) rotate(0deg); }
        40% { transform: translate(2px, -2px) rotate(1deg); }
        50% { transform: translate(-2px, 4px) rotate(-1deg); }
        60% { transform: translate(-6px, 2px) rotate(0deg); }
        70% { transform: translate(6px, 2px) rotate(-1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      .shake-heavy {
        animation: screen-shake 0.8s;
      }
      @keyframes hit-flash {
        0% { filter: brightness(4) contrast(1.5); transform: scale(1.1); }
        100% { filter: brightness(1) contrast(1); transform: scale(1); }
      }
      .hit-flash {
        animation: hit-flash 0.2s ease-out forwards;
      }
      @keyframes star-burst {
        0% { transform: scale(0) rotate(0deg); opacity: 1; }
        100% { transform: scale(2) rotate(360deg); opacity: 0; }
      }
      .star-celeb {
        animation: star-burst 0.6s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
